events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS resolver for Docker's internal network (127.0.0.11)
    resolver 127.0.0.11 valid=30s;
    
    server {
        listen 8443 ssl;
        server_name localhost;

        # Use the existing Wazuh Dashboard certificates
        ssl_certificate /etc/nginx/certs/wazuh.dashboard.pem;
        ssl_certificate_key /etc/nginx/certs/wazuh.dashboard-key.pem;

        # Optimized SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Proxy to the Wazuh Dashboard container
            proxy_pass https://wazuh.dashboard:5601;

            # Important: Strip the restrictive X-Frame-Options header
            proxy_hide_header X-Frame-Options;

            # Pass necessary headers back to the dashboard
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optional: Overwrite with a more permissive framing policy if needed
            # add_header X-Frame-Options ALLOWALL; 
        }
    }

    server {
        listen 8843 ssl;
        server_name localhost;

        # Use the existing Wazuh Dashboard certificates
        ssl_certificate /etc/nginx/certs/wazuh.dashboard.pem;
        ssl_certificate_key /etc/nginx/certs/wazuh.dashboard-key.pem;

        # Optimized SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # Proxy to the MeshCentral container
            proxy_pass https://meshcentral:443;
            
            # WebSockets support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Pass necessary headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Force Secure cookie flag
            proxy_cookie_path / "/; Secure";
        }
    }

    server {
        listen 8080 ssl;
        server_name localhost;

        # Use the existing Wazuh Dashboard certificates
        ssl_certificate /etc/nginx/certs/wazuh.dashboard.pem;
        ssl_certificate_key /etc/nginx/certs/wazuh.dashboard-key.pem;

        # Optimized SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
